<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="sn-t sn-d" font-family="var(--serif)">
<title id="sn-t">Every figure, as the sources give it</title><desc id="sn-d">Crates of cucumbers per season: 20,000 in 1897 (Ocala Evening Star); 57,000 in one season not named (Cammack, 1916); over 200,000 in 1919 (Lakeland Evening Telegram). Cars per day: nine in one day in 1907, by hearsay; 22 a day at the height of the 1910 season; 13 to 20 a day in the peak week of 1919. Seventy-five carloads a day appears only in recent accounts and has no source of the time.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Every figure, as the sources give it</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Williston’s cucumber trade in the sources of its time. Each label links to its passage.</text>
<text x="16" y="84" font-size="14" font-weight="bold" fill="var(--ink)">Crates in a season</text>
<line x1="70" y1="400" x2="400" y2="400" stroke="var(--line)"/><text x="64" y="404" font-size="11" text-anchor="end" fill="var(--ink2)">0</text>
<line x1="70" y1="334" x2="400" y2="334" stroke="var(--line)"/><text x="64" y="338" font-size="11" text-anchor="end" fill="var(--ink2)">50,000</text>
<line x1="70" y1="268" x2="400" y2="268" stroke="var(--line)"/><text x="64" y="272" font-size="11" text-anchor="end" fill="var(--ink2)">100,000</text>
<line x1="70" y1="202" x2="400" y2="202" stroke="var(--line)"/><text x="64" y="206" font-size="11" text-anchor="end" fill="var(--ink2)">150,000</text>
<line x1="70" y1="136" x2="400" y2="136" stroke="var(--line)"/><text x="64" y="140" font-size="11" text-anchor="end" fill="var(--ink2)">200,000</text>
<a href="#/text/shipping/first/1"><rect x="100" y="374" width="62" height="26" fill="var(--crop)"/><text x="131" y="368" font-size="12" text-anchor="middle" fill="var(--ink)" text-decoration="underline">20,000</text></a><text x="131" y="418" font-size="12" text-anchor="middle" fill="var(--ink)">1897</text>
<a href="#/text/shipping/trainload/9"><rect x="200" y="325" width="62" height="75" fill="var(--crop)"/><text x="231" y="319" font-size="12" text-anchor="middle" fill="var(--ink)" text-decoration="underline">57,000</text></a><text x="231" y="418" font-size="12" text-anchor="middle" fill="var(--ink)">season?</text>
<a href="#/text/shipping/season/12"><rect x="300" y="136" width="62" height="264" fill="var(--crop)"/><text x="331" y="130" font-size="12" text-anchor="middle" fill="var(--ink)" text-decoration="underline">over 200,000</text></a><text x="331" y="418" font-size="12" text-anchor="middle" fill="var(--ink)">1919</text>
<text x="70" y="440" font-size="11.5" fill="var(--ink2)">“season?”: Cammack (1916) does not name the season.</text>
<text x="450" y="84" font-size="14" font-weight="bold" fill="var(--ink)">Cars in a day</text>
<line x1="480" y1="400" x2="880" y2="400" stroke="var(--line)"/><text x="474" y="404" font-size="11" text-anchor="end" fill="var(--ink2)">0</text>
<line x1="480" y1="328" x2="880" y2="328" stroke="var(--line)"/><text x="474" y="332" font-size="11" text-anchor="end" fill="var(--ink2)">20</text>
<line x1="480" y1="255" x2="880" y2="255" stroke="var(--line)"/><text x="474" y="259" font-size="11" text-anchor="end" fill="var(--ink2)">40</text>
<line x1="480" y1="182" x2="880" y2="182" stroke="var(--line)"/><text x="474" y="186" font-size="11" text-anchor="end" fill="var(--ink2)">60</text>
<line x1="480" y1="110" x2="880" y2="110" stroke="var(--line)"/><text x="474" y="114" font-size="11" text-anchor="end" fill="var(--ink2)">80</text>
<rect x="510" y="367" width="54" height="33" fill="var(--rail)"/>
<a href="#/text/shipping/first/5"><text x="537" y="361" font-size="11.5" text-anchor="middle" fill="var(--ink)" text-decoration="underline">9</text></a><text x="537" y="418" font-size="12" text-anchor="middle" fill="var(--ink)">1907</text>
<rect x="602" y="320" width="54" height="80" fill="var(--rail)"/>
