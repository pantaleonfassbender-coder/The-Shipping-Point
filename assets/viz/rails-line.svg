<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-labelledby="rl-t rl-d" font-family="var(--serif)">
<title id="rl-t">Eleven miles to Archer, then two roads</title><desc id="rl-d">Timeline 1886 to 1907. In 1886 Williston has no railroad; Archer, eleven miles off, is its shipping point. In 1891 about 350 men work on the line from Archer to Dunnellon, to be operated by the Florida Central &amp; Peninsular. In 1893 the Plant System agrees with its rival on the common use of the spur south of Archer. In 1895 a gazetteer places Williston on both roads; the town is incorporated in 1897; in 1898 the Railroad Commission lists two Williston stations with the same rates. In 1905 the legislature declares the incorporation lawful. In 1907 the lines appear as the Seaboard Air Line and the Atlantic Coast Line.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Eleven miles to Archer, then two roads</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Dashed: announced or arranged, not yet attested for Williston. Each label links to its passage.</text>
<line x1="60" y1="260" x2="860" y2="260" stroke="var(--ink2)"/>
