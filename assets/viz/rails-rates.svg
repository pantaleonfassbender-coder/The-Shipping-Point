<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="rr-t rr-d" font-family="var(--serif)">
<title id="rr-t">Ten cents a crate, on either road</title><desc id="rr-d">Rates of the Railroad Commission of Florida, 1898, in cents, vegetables per crate and oranges per box. Plant System to High Springs: Archer 10 and 15, Montbrook 10 and 16, Williston 10 and 16, Morriston 11 and 16, Juliette 11 and 16. Florida Central &amp; Peninsular to Jacksonville and the other junctions: Archer 10 and 15, Montbrook 10 and 16, Williston 10 and 16, Morriston 11 and 16, Early Bird 11 and 16. The charge onward to the northern markets was an interstate rate the commission could not set.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Ten cents a crate, on either road</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Rates set by the Railroad Commission of Florida, 1898, in cents: bar = vegetables per crate, figure in brackets = oranges per box.</text>
<a href="#/text/rails/rates/7"><text x="150" y="84" font-size="13" font-weight="bold" fill="var(--rail)" text-decoration="underline">Plant System, to High Springs</text></a>
<a href="#/text/rails/rates/8"><text x="480" y="84" font-size="13" font-weight="bold" fill="var(--rail)" text-decoration="underline">Florida Central &amp; Peninsular, to Jacksonville</text></a>
<text x="20" y="120" font-size="13.5" fill="var(--ink)" >Archer</text>
<rect x="150" y="104" width="220" height="22" fill="var(--rail)" opacity="0.7"/><text x="376" y="120" font-size="13" fill="var(--ink)">10¢ <tspan fill="var(--ink2)">(15¢)</tspan></text>
<rect x="480" y="104" width="220" height="22" fill="var(--rail)" opacity="0.7"/><text x="706" y="120" font-size="13" fill="var(--ink)">10¢ <tspan fill="var(--ink2)">(15¢)</tspan></text>
<text x="20" y="154" font-size="13.5" fill="var(--ink)" >Montbrook</text>
<rect x="150" y="138" width="220" height="22" fill="var(--rail)" opacity="0.7"/><text x="376" y="154" font-size="13" fill="var(--ink)">10¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<rect x="480" y="138" width="220" height="22" fill="var(--rail)" opacity="0.7"/><text x="706" y="154" font-size="13" fill="var(--ink)">10¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<rect x="14" y="168" width="872" height="30" rx="5" fill="var(--crop)" opacity=".12"/>
<text x="20" y="188" font-size="13.5" fill="var(--ink)" font-weight="bold">Williston</text>
<rect x="150" y="172" width="220" height="22" fill="var(--rail)" opacity="1"/><text x="376" y="188" font-size="13" fill="var(--ink)">10¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<rect x="480" y="172" width="220" height="22" fill="var(--rail)" opacity="1"/><text x="706" y="188" font-size="13" fill="var(--ink)">10¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<text x="20" y="222" font-size="13.5" fill="var(--ink)" >Morriston</text>
<rect x="150" y="206" width="242" height="22" fill="var(--rail)" opacity="0.7"/><text x="398" y="222" font-size="13" fill="var(--ink)">11¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<rect x="480" y="206" width="242" height="22" fill="var(--rail)" opacity="0.7"/><text x="728" y="222" font-size="13" fill="var(--ink)">11¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<text x="20" y="256" font-size="13.5" fill="var(--ink)" >Juliette</text>
<rect x="150" y="240" width="242" height="22" fill="var(--rail)" opacity="0.7"/><text x="398" y="256" font-size="13" fill="var(--ink)">11¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<text x="480" y="256" font-size="12" fill="var(--ink2)">not on this road</text>
<text x="20" y="290" font-size="13.5" fill="var(--ink)" >Early Bird</text>
<text x="150" y="290" font-size="12" fill="var(--ink2)">not on this road</text>
<rect x="480" y="274" width="242" height="22" fill="var(--rail)" opacity="0.7"/><text x="728" y="290" font-size="13" fill="var(--ink)">11¢ <tspan fill="var(--ink2)">(16¢)</tspan></text>
<text x="20" y="338" font-size="13.5" fill="var(--ink)">Onward</text>
<rect x="150" y="322" width="720" height="22" fill="none" stroke="var(--colour)" stroke-dasharray="6 4"/>
<a href="#/text/rails/rates/10"><text x="160" y="338" font-size="13" fill="var(--colour)" text-decoration="underline">to New York and the other markets: an interstate rate, “beyond the limits of the State”, not set by the commission</text></a>
<text x="20" y="374" font-size="12" fill="var(--ink2)">Same rate from both Williston stations: the commission charged by the mile (unit 9).</text>
<text x="20" y="391" font-size="12" fill="var(--ink2)">What a shipper could weigh between the roads was service, cars and connections, which the tables do not show.</text>
</svg>