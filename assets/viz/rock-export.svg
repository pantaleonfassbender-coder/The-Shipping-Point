<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="re-t re-d" font-family="var(--serif)">
<title id="re-t">Almost all of it went abroad</title><desc id="re-d">Florida hard rock phosphate in long tons. Exported and domestic shipments: 1909 496,645 and 17,456; 1910 461,353 and 18,745; 1911 462,072 and 16,723; 1912 470,354 and 15,425; 1913 476,898 and 12,896; 1914 303,172 and 6,517; 1915 43,314 and 6,816; 1916 28,045 and 19,042; 1917 12,403 and 6,205 (1917 including soft rock). No figure for 1918 in the reports examined. Marketed, not divided between export and home: 1919 285,467; 1920 400,249.</desc>
<text x="16" y="28" font-size="17" font-weight="bold" fill="var(--ink)">Almost all of it went abroad</text>
<text x="16" y="48" font-size="13" fill="var(--ink2)">Florida hard rock phosphate, long tons, after the Florida Geological Survey. Each bar links to its passage.</text>
<rect x="16" y="60" width="14" height="12" fill="var(--rock)"/><text x="36" y="71" font-size="12.5" fill="var(--ink)">exported</text><rect x="110" y="60" width="14" height="12" fill="var(--crop)"/><text x="130" y="71" font-size="12.5" fill="var(--ink)">shipped for use at home</text><rect x="300" y="60" width="14" height="12" fill="none" stroke="var(--rock)" stroke-dasharray="3 2"/><text x="320" y="71" font-size="12.5" fill="var(--ink)">marketed, not divided (1919–1920)</text>
<line x1="70" y1="360" x2="880" y2="360" stroke="var(--line)"/><text x="64" y="364" font-size="11" text-anchor="end" fill="var(--ink2)">0</text>
