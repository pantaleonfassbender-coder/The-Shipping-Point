<text x="16" y="406" font-size="12" fill="var(--ink2)">1909–1913: 96 to 97 of every 100 tons shipped went abroad. 1917 includes some soft rock. 1919 and 1920: quantities marketed, not divided.</text>
<text x="16" y="424" font-size="12" fill="var(--ink2)">Sources: Seventh Annual Report (1915), p. 22; Tenth and Eleventh Annual Reports (1918), p. 106; Fourteenth Annual Report (1922), p. 29.</text>
